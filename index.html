<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queen Of Angel — Planet Ring Background</title>
<style>
* { box-sizing: border-box; }
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
    background: #05050d;
}
/* Animasi planet berada di lapisan paling belakang */
#webgl-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
}
#webgl-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}
/* Bintang bergerak tambahan */
.stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: transparent url("https://www.transparenttextures.com/patterns/stardust.png") repeat;
    animation: moveStars 60s linear infinite;
}
@keyframes moveStars {
    from { background-position: 0 0; }
    to { background-position: 10000px 5000px; }
}
.container {
    position: relative;
    z-index: 2;
    width: min(320px, calc(100vw - 32px));
    margin: 70px auto 0;
    padding: 20px;
    background: rgba(0, 0, 0, 0.72);
    border: 1px solid rgba(0, 240, 255, 0.95);
    border-radius: 15px;
    box-shadow:
        0 0 12px rgba(0, 240, 255, 0.95),
        0 0 28px rgba(0, 240, 255, 0.8),
        0 0 50px rgba(0, 140, 255, 0.65),
        0 0 80px rgba(0, 100, 255, 0.4),
        inset 0 0 18px rgba(0, 240, 255, 0.12);
    animation: fadeIn 2s;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}
.container img {
    width: 200px;
    height: 200px;
    max-width: 100%;
    object-fit: cover;
    border-radius: 18px;
    border: 3px solid #00f0ff;
    margin-bottom: 10px;
    box-shadow: 0 0 10px #00f0ff, 0 0 22px #00f0ff,
                0 0 40px rgba(0, 140, 255, 0.9);
}
h2 {
    color: #00f0ff;
    text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
}
.link {
    display: block;
    margin: 12px 0;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    color: white;
    border: 2px solid #00f0ff;
    background: rgba(0, 8, 25, 0.62);
    box-shadow: 0 0 8px #00f0ff, 0 0 18px rgba(0, 240, 255, 0.7),
                inset 0 0 8px rgba(0, 240, 255, 0.18);
    transition: 0.3s;
}
.link:hover {
    background: #00f0ff;
    color: black;
    box-shadow: 0 0 14px #00f0ff, 0 0 30px #00f0ff,
                0 0 48px rgba(0, 140, 255, 0.95);
    transform: scale(1.04);
}
@media (max-height: 650px) {
    .container { margin-top: 12px; padding: 12px; }
    .container img { width: 120px; }
    .link { margin: 7px 0; padding: 9px; }
}
/* Panel konten muncul di atas animasi planet tanpa mengganti background */
.panel {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    overflow-y: auto;
    padding: 28px 16px;
    background: rgba(2, 4, 18, 0.42);
    backdrop-filter: blur(2px);
}
.panel.active { display: block; }
.panel-card {
    width: min(920px, 100%);
    margin: 18px auto;
    padding: 24px;
    border: 1px solid rgba(0, 240, 255, .8);
    border-radius: 18px;
    background: rgba(3, 8, 28, .82);
    box-shadow: 0 0 25px rgba(0, 240, 255, .35), inset 0 0 22px rgba(0, 240, 255, .07);
}
.panel-title { margin: 0 0 8px; color: #00f0ff; text-shadow: 0 0 12px #00f0ff; }
.panel-description { color: #d9faff; margin: 0 0 20px; }
.panel-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0; }
.neon-button {
    display: inline-block; cursor: pointer; padding: 11px 16px; border-radius: 9px;
    border: 1px solid #00f0ff; background: rgba(0, 240, 255, .08); color: white;
    text-decoration: none; font-weight: bold; font-size: 14px;
    box-shadow: 0 0 12px rgba(0,240,255,.14); transition: .25s;
}
.neon-button:hover { background: #00f0ff; color: #001018; box-shadow: 0 0 22px #00f0ff; }
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.photo-frame {
    min-width: 0; padding: 10px; border: 2px solid #00f0ff; border-radius: 14px;
    background: rgba(0, 0, 0, .55);
    box-shadow: 0 0 10px #00f0ff, 0 0 22px rgba(0,240,255,.65),
                inset 0 0 12px rgba(0,240,255,.18);
    transition: transform .25s, box-shadow .25s;
}
.photo-frame:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 15px #00f0ff, 0 0 32px #00f0ff,
                0 0 48px rgba(0,140,255,.85);
}
.photo-frame img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 5px; border: 0; margin: 0; }
.photo-frame p { margin: 10px 0 2px; color: #dffcff; font-weight: bold; overflow-wrap: anywhere; }
.media-player { display: block; width: min(640px, 100%); margin: 18px auto; border-radius: 12px; }
.close-button { margin-top: 18px; }
@media (max-width: 650px) {
    .panel { padding: 12px 10px; }
    .panel-card { padding: 16px 12px; margin: 8px auto; }
    .photo-grid { grid-template-columns: 1fr; gap: 15px; }
    .photo-frame { max-width: 360px; width: 100%; margin: auto; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="webgl-container"></div>
<div class="stars"></div>
<div class="container">

<img src="c:\Vyna_Sylviana.jpg">

<h2>Queen Of Angel</h2>
<p>Vyna Sylviana</p>

<!-- Panel galeri: background planet tetap berjalan di belakangnya -->
<section class="panel" id="gallery-panel" aria-hidden="true">
  <div class="panel-card">
    <h2 class="panel-title">My Photo Gallery</h2>
    <p class="panel-description">Koleksi foto dalam bingkai neon di tengah luar angkasa.</p>
    <div class="photo-grid">
      <div class="photo-frame">
        <img src="c:\Vy1.jpg" alt="Foto 1" onerror="this.onerror=null;this.src='https://placehold.co/600x600/071426/00f0ff?text=Foto+1';">

      <div class="photo-frame">
        <img src="c:\Vy2.jpg" alt="Foto 2" onerror="this.onerror=null;this.src='https://placehold.co/600x600/071426/00f0ff?text=Foto+2';">
        <p>Foto 2</p>
      </div>
      <div class="photo-frame">
        <img src="c:\Vy3.jpg" alt="Foto 3" onerror="this.onerror=null;this.src='https://placehold.co/600x600/071426/00f0ff?text=Foto+3';">
        <p>Foto 3</p>
      </div>
    </div>
    <div class="panel-actions">
      <a class="neon-button" href="https://drive.google.com/drive/folders/1jq2veWxqnZGkFyf5CbE1yiFefYDOGQhT?usp=drive_link" target="_blank" rel="noopener noreferrer">Buka Google Drive</a>

<!-- Panel musik juga tampil di atas background planet yang sama -->
<section class="panel" id="music-panel" aria-hidden="true">
  <div class="panel-card">
    <h2 class="panel-title">My Music</h2>
    <p class="panel-description">Putar musik tanpa meninggalkan halaman planet.</p>
    <video class="media-player" src="Ibadow___Ibadowa_-_For_the_rest_of_my_life__Cover_Maher_Zain_(128k).mp3" controls playsinline preload="metadata">
      Browser lu belum mendukung pemutar video ini.
    </video>
    <div class="panel-actions">
      <button class="neon-button" type="button" onclick="closePanels()">Kembali ke halaman utama</button>
    </div>
  </div>
</section>

<script>
function openPanel(panelId) {
  closePanels();
  const panel = document.getElementById(panelId);
  if (panel) {
    panel.classList.add('active');
    panel.setAttribute('aria-hidden', 'false');
  }
}
function closePanels() {
  document.querySelectorAll('.panel').forEach(panel => {
    panel.classList.remove('active');
    panel.setAttribute('aria-hidden', 'true');
  });
  const video = document.querySelector('#music-panel video');
  if (video) video.pause();
}
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closePanels();
});

        // Setup Scene, Camera, Renderer
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        // Kabut latar belakang untuk efek kedalaman
        scene.fog = new THREE.FogExp2(0x05050d, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Kontrol Mouse / Touch (Bisa diputar dengan mouse)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // -------------------------------------------------------------
        // 1. MEMBUAT BOLA PLANET (PARTIKEL)
        // -------------------------------------------------------------
        const planetRadius = 7;
        const planetParticleCount = 300000;
        const planetGeometry = new THREE.BufferGeometry();
        const planetPositions = new Float32Array(planetParticleCount * 3);
        const planetColors = new Float32Array(planetParticleCount * 3);

        const colorCoreBlue = new THREE.Color(0x00d2ff);
        const colorCoreWhite = new THREE.Color(0xffffff);

        for (let i = 0; i < planetParticleCount; i++) {
            // Distribusi acak permukaan bola (Sphere Surface)
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = planetRadius + (Math.random() - 0.5) * 0.4;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            planetPositions[i * 3] = x;
            planetPositions[i * 3 + 1] = y;
            planetPositions[i * 3 + 2] = z;

            // Variasi Warna Planet (biru & putih)
            const mixedColor = colorCoreBlue.clone().lerp(colorCoreWhite, Math.random() * 0.5);
            planetColors[i * 3] = mixedColor.r;
            planetColors[i * 3 + 1] = mixedColor.g;
            planetColors[i * 3 + 2] = mixedColor.b;
        }

        planetGeometry.setAttribute('position', new THREE.BufferAttribute(planetPositions, 3));
        planetGeometry.setAttribute('color', new THREE.BufferAttribute(planetColors, 3));

        const planetMaterial = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const planetMesh = new THREE.Points(planetGeometry, planetMaterial);
        scene.add(planetMesh);

        // -------------------------------------------------------------
        // 2. MEMBUAT CINCIN PLANET (RING OF PARTICLES)
        // -------------------------------------------------------------
        const ringParticleCount = 300000;
        const ringGeometry = new THREE.BufferGeometry();
        const ringPositions = new Float32Array(ringParticleCount * 3);
        const ringColors = new Float32Array(ringParticleCount * 3);

        const colorCyan = new THREE.Color(0x00f0ff);
        const colorDarkBlue = new THREE.Color(0x0044ff);
        const colorGold = new THREE.Color(0xffaa00);

        for (let i = 0; i < ringParticleCount; i++) {
            const innerRadius = 10;
            const outerRadius = 22;
            const radius = THREE.MathUtils.lerp(innerRadius, outerRadius, Math.pow(Math.random(), 1.5));
            const angle = Math.random() * Math.PI * 2;

            // Posisi melingkar dengan sedikit variasi ketebalan (Y)
            const x = Math.cos(angle) * radius;
            const y = (Math.random() - 0.5) * (1.2 * (radius / outerRadius));
            const z = Math.sin(angle) * radius;

            ringPositions[i * 3] = x;
            ringPositions[i * 3 + 1] = y;
            ringPositions[i * 3 + 2] = z;

            // Pewarnaan Cincin Gradasi Biru, Cyan, hingga Emas di bagian luar
            let baseColor;
            if (radius < 13) {
                baseColor = colorDarkBlue.clone().lerp(colorCyan, Math.random());
            } else if (radius < 18) {
                baseColor = colorCyan.clone().lerp(colorCoreWhite, Math.random() * 0.7);
            } else {
                baseColor = colorCyan.clone().lerp(colorGold, Math.random() * 0.8);
            }

            ringColors[i * 3] = baseColor.r;
            ringColors[i * 3 + 1] = baseColor.g;
            ringColors[i * 3 + 2] = baseColor.b;
        }

        ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
        ringGeometry.setAttribute('color', new THREE.BufferAttribute(ringColors, 3));

        const ringMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const ringMesh = new THREE.Points(ringGeometry, ringMaterial);
        
        // Miringkan Cincin Planet
        ringMesh.rotation.x = Math.PI / 7;
        ringMesh.rotation.z = -Math.PI / 10;
        scene.add(ringMesh);

        // -------------------------------------------------------------
        // 3. DEBU BINTANG & PARTIKEL LATAR BELAKANG
        // -------------------------------------------------------------
        const bgParticleCount = 10000;
        const bgGeometry = new THREE.BufferGeometry();
        const bgPositions = new Float32Array(bgParticleCount * 3);

        for (let i = 0; i < bgParticleCount; i++) {
            bgPositions[i * 3] = (Math.random() - 0.5) * 120;
            bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 120;
            bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 120;
        }

        bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));

        const bgMaterial = new THREE.PointsMaterial({
            size: 0.08,
            color: 0xffffff,
            transparent: true,
            opacity: 0.4
        });

        const bgMesh = new THREE.Points(bgGeometry, bgMaterial);
        scene.add(bgMesh);

        // -------------------------------------------------------------
        // ANIMASI & LOOP RENDER
        // -------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            // Putar Planet & Cincin
            planetMesh.rotation.y += 0.002;
            ringMesh.rotation.y += 0.003;
            bgMesh.rotation.y -= 0.0003;

            controls.update();
            renderer.render(scene, camera);
        }

        // Responsif saat jendela browser di-resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Jalankan Animasi
        animate();
    
</script>
</body>
</html>
